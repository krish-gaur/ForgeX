# ═══════════════════════════════════════════════════════════════════════════
# ForgeX — production-shaped stack.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#
# Default profile : postgres + backend (FastAPI) + frontend (Next.js)
# Optional profiles:
#   --profile celery : redis + celery worker (TASK_BACKEND=celery)
#   --profile neo4j  : neo4j graph store      (GRAPH_STORE=neo4j)
#   --profile edge   : nginx TLS-ready edge   (ports 80/443 instead of 3000)
# ═══════════════════════════════════════════════════════════════════════════
name: forgex

x-backend-env: &backend-env
  ENVIRONMENT: production
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production-0123456789abcdef0123456789abcdef}
  DATABASE_URL: postgresql+asyncpg://forgex:forgex@postgres:5432/forgex
  AUTO_CREATE_SCHEMA: "false"
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  TRUSTED_PROXY: "true"
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  BLOCKCHAIN_ANCHOR: ${BLOCKCHAIN_ANCHOR:-local}
  SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
  SEPOLIA_PRIVATE_KEY: ${SEPOLIA_PRIVATE_KEY:-}
  DEMO_SEED_ON_BOOT: ${DEMO_SEED_ON_BOOT:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgex
      POSTGRES_PASSWORD: forgex
      POSTGRES_DB: forgex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgex"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    environment:
      <<: *backend-env
      TASK_BACKEND: ${TASK_BACKEND:-inline}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      GRAPH_STORE: ${GRAPH_STORE:-sql}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-forgex-neo4j}
      DATASET_DIR: /srv/forgex/datasets
    volumes:
      - forgex-data:/srv/forgex/backend/data
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ---- optional: celery worker (docker compose --profile celery up) ----
  redis:
    image: redis:7-alpine
    profiles: ["celery"]
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    profiles: ["celery"]
    environment:
      <<: *backend-env
      TASK_BACKEND: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATASET_DIR: /srv/forgex/datasets
    volumes:
      - forgex-data:/srv/forgex/backend/data
    command: python -m celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # ---- optional: neo4j correlation store (--profile neo4j) ----
  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-forgex-neo4j}
    volumes:
      - neo4jdata:/data
    restart: unless-stopped

  # ---- optional: nginx edge (--profile edge, serves :80) ----
  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    volumes:
      - ./../nginx/forgex.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  forgex-data:
  neo4jdata:
